<text id="Esses dados indicam que vulnerabilidades econ&#195;&#180;micas, sociais, ambientais e demogr&#195;&#161;ficas est&#195;&#163;o diretamente relacionadas aos altos &#195;&#173;ndices de desnutri&#195;&#167;&#195;&#163;o observados nessas popula&#195;&#167;&#195;&#181;es (DW, 2024)." fill="#242628" xml:space="preserve" style="white-space: pre" font-family="'Montserrat', sans-serif" font-size="18" font-weight="500" letter-spacing="0em"><tspan x="177.671" y="534.953">Esses dados indicam que vulnerabilidades econ&#xf4;micas, sociais, ambientais e </tspan><tspan x="169.075" y="559.953">demogr&#xe1;ficas est&#xe3;o diretamente relacionadas aos altos &#xed;ndices de desnutri&#xe7;&#xe3;o </tspan><tspan x="327.015" y="584.953">observados nessas popula&#xe7;&#xf5;es (DW, 2024). &#13;</tspan></text>
