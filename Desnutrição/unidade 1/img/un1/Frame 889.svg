<text id="Quando analisamos grupos populacionais em situa&#195;&#167;&#195;&#163;o de exclus&#195;&#163;o social, como ind&#195;&#173;genas e outros povos e comunidades tradicionais, os dados mostram uma alta preval&#195;&#170;ncia de baixa estatura entre crian&#195;&#167;as, que &#195;&#169; a forma mais comum de desnutri&#195;&#167;&#195;&#163;o no Brasil. Por exemplo, veja nos quadros ao lado (Brasil, 2023a):" fill="#F5F6F6" xml:space="preserve" style="white-space: pre" font-family="'Montserrat', sans-serif" font-size="18" font-weight="600" letter-spacing="0em"><tspan x="74.1377" y="219.953">Quando analisamos grupos </tspan><tspan x="63.2393" y="244.953">populacionais em situa&#xe7;&#xe3;o de </tspan><tspan x="45.2744" y="269.953">exclus&#xe3;o social, como ind&#xed;genas e </tspan><tspan x="67.8447" y="294.953">outros povos e comunidades </tspan><tspan x="33.6113" y="319.953">tradicionais, os dados mostram uma </tspan><tspan x="45.6436" y="344.953">alta preval&#xea;ncia de baixa estatura </tspan><tspan x="42.1191" y="369.953">entre crian&#xe7;as, que &#xe9; a forma mais </tspan><tspan x="48.6758" y="394.953">comum de desnutri&#xe7;&#xe3;o no Brasil. </tspan><tspan x="46.0918" y="419.953">Por exemplo, veja nos quadros ao </tspan><tspan x="113.056" y="444.953">lado (Brasil, 2023a):</tspan></text>
