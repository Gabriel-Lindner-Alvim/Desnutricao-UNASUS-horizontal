<svg width="1074" height="165" viewBox="0 0 1074 165" fill="none" xmlns="http://www.w3.org/2000/svg">
<g id="Group 1316">
<g id="Frame 708">
<text id="&#34;&#195;&#137; comum atribuir os termos desnutri&#195;&#167;&#195;&#163;o aguda e desnutri&#195;&#167;&#195;&#163;o cr&#195;&#180;nica para se referir &#195;&#160; crian&#195;&#167;a com d&#195;&#169;ficit de peso e &#195;&#160; crian&#195;&#167;a com baixa estatura, respectivamente. Mas em 1995, a OMS (WHO,1995) desencorajou o uso do termo desnutri&#195;&#167;&#195;&#163;o cr&#195;&#180;nica como sin&#195;&#180;nimo de baixa estatura, devido &#195;&#160; dificuldade em diferenciar se o comprometimento atual foi ocasionado por evento do passado ou se &#195;&#169; resultante de processo cont&#195;&#173;nuo que ainda est&#195;&#161; presente. Essa diferencia&#195;&#167;&#195;&#163;o &#195;&#169; fundamental para direcionar a conduta a ser adotada no tratamento.&#34; (Brasil, 2023a, p.6)" fill="#242628" xml:space="preserve" style="white-space: pre" font-family="'Montserrat', sans-serif" font-size="18" font-style="italic" letter-spacing="0em"><tspan x="92" y="32.953">&#34;&#xc9; </tspan><tspan x="116.236" y="32.953">comum </tspan><tspan x="193.26" y="32.953">atribuir </tspan><tspan x="266.539" y="32.953">os </tspan><tspan x="292.094" y="32.953">termos </tspan><tspan x="361.682" y="32.953">desnutri&#xe7;&#xe3;o </tspan><tspan x="475.988" y="32.953">aguda </tspan><tspan x="542.482" y="32.953">e </tspan><tspan x="558.826" y="32.953">desnutri&#xe7;&#xe3;o </tspan><tspan x="673.133" y="32.953">cr&#xf4;nica </tspan><tspan x="746.219" y="32.953">para </tspan><tspan x="795.293" y="32.953">se </tspan><tspan x="820.426" y="32.953">referir </tspan><tspan x="879.713" y="32.953">&#xe0; </tspan><tspan x="897.393" y="32.953">crian&#xe7;a </tspan><tspan x="92" y="57.953">com </tspan><tspan x="140.588" y="57.953">d&#xe9;ficit </tspan><tspan x="205.014" y="57.953">de </tspan><tspan x="236.305" y="57.953">peso </tspan><tspan x="287.671" y="57.953">e </tspan><tspan x="306.763" y="57.953">&#xe0; </tspan><tspan x="327.191" y="57.953">crian&#xe7;a </tspan><tspan x="404.027" y="57.953">com </tspan><tspan x="452.615" y="57.953">baixa </tspan><tspan x="511.592" y="57.953">estatura, </tspan><tspan x="601.102" y="57.953">respectivamente. </tspan><tspan x="766.936" y="57.953">Mas </tspan><tspan x="813.345" y="57.953">em </tspan><tspan x="851.527" y="57.953">1995, </tspan><tspan x="902.207" y="57.953">a </tspan><tspan x="922.635" y="57.953">OMS </tspan><tspan x="92" y="82.953">(WHO,1995) </tspan><tspan x="199.651" y="82.953">desencorajou </tspan><tspan x="328.115" y="82.953">o </tspan><tspan x="344.202" y="82.953">uso </tspan><tspan x="381.171" y="82.953">do </tspan><tspan x="409.457" y="82.953">termo </tspan><tspan x="469.577" y="82.953">desnutri&#xe7;&#xe3;o </tspan><tspan x="583.205" y="82.953">cr&#xf4;nica </tspan><tspan x="655.612" y="82.953">como </tspan><tspan x="712.058" y="82.953">sin&#xf4;nimo </tspan><tspan x="801.305" y="82.953">de </tspan><tspan x="829.169" y="82.953">baixa </tspan><tspan x="884.719" y="82.953">estatura, </tspan><tspan x="92" y="107.953">devido </tspan><tspan x="158.601" y="107.953">&#xe0; </tspan><tspan x="176.44" y="107.953">dificuldade </tspan><tspan x="284.613" y="107.953">em </tspan><tspan x="320.205" y="107.953">diferenciar </tspan><tspan x="423.966" y="107.953">se </tspan><tspan x="449.258" y="107.953">o </tspan><tspan x="466.183" y="107.953">comprometimento </tspan><tspan x="645.178" y="107.953">atual </tspan><tspan x="699.474" y="107.953">foi </tspan><tspan x="727.175" y="107.953">ocasionado </tspan><tspan x="839.039" y="107.953">por </tspan><tspan x="875.388" y="107.953">evento </tspan><tspan x="942.516" y="107.953">do </tspan><tspan x="92" y="132.953">passado </tspan><tspan x="175.175" y="132.953">ou </tspan><tspan x="204.068" y="132.953">se </tspan><tspan x="229.235" y="132.953">&#xe9; </tspan><tspan x="245.612" y="132.953">resultante </tspan><tspan x="343.921" y="132.953">de </tspan><tspan x="372.498" y="132.953">processo </tspan><tspan x="458.204" y="132.953">cont&#xed;nuo </tspan><tspan x="544.859" y="132.953">que </tspan><tspan x="585.53" y="132.953">ainda </tspan><tspan x="644.64" y="132.953">est&#xe1; </tspan><tspan x="689.002" y="132.953">presente. </tspan><tspan x="778.065" y="132.953">Essa </tspan><tspan x="825.257" y="132.953">diferencia&#xe7;&#xe3;o </tspan><tspan x="955.137" y="132.953">&#xe9; </tspan><tspan x="92" y="157.953">fundamental </tspan><tspan x="217.613" y="157.953">para </tspan><tspan x="265.918" y="157.953">direcionar </tspan><tspan x="363.23" y="157.953">a </tspan><tspan x="380.141" y="157.953">conduta </tspan><tspan x="461.773" y="157.953">a </tspan><tspan x="478.684" y="157.953">ser </tspan><tspan x="510.271" y="157.953">adotada </tspan><tspan x="594.26" y="157.953">no </tspan><tspan x="622.42" y="157.953">tratamento.&#34; </tspan><tspan x="742.531" y="157.953">(Brasil, </tspan><tspan x="808.203" y="157.953">2023a, </tspan><tspan x="871.432" y="157.953">p.6)</tspan></text>
</g>
