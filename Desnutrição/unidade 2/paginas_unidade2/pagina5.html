<div class="container-fluid text-start" style="padding-left: 12vw; padding-right: 12vw; max-width: 2500px;">
    <div class="row" style="margin-bottom: 5vh;">
        <div class="col-md-12 borda-inicial" style="text-align: center; margin-bottom: 5vh;">
            <img src="img/Group 1490.svg" width="100%" style="max-width: 1300px;">
        </div>
        <div class="col-md-8">
            <p>Além disso, o leite humano oferece proteção contra infecções intestinais e respiratórias — doenças que estão entre as principais causas de desnutrição e do agravamento do estado nutricional nos primeiros anos de vida.  </p>

        <div class="col-md-4" style="display: flex; justify-content: center; align-items: center;">

<div class="modal fade" id="ModalCriancas" tabindex="-1" aria-hidden="true">

    <div class="modal-content" style="background: transparent; border: none;">
      <div class="modal-body position-relative p-0" style="text-align: center;">

         <!-- Container for image and overlay -->
        <div style="position: relative; display: inline-block;">
          <img src="img/destaque-modal5.svg" class="img-fluid">
          
          <!-- Close button in top-right of image -->
          <img src="../img/botao-x.svg"
