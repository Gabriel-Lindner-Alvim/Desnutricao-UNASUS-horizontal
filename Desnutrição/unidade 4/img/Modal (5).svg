<g id="O instrutivo sobre inseguran&#195;&#167;a alimentar na APS est&#195;&#161; dispon&#195;&#173;vel para todas as unidades de sa&#195;&#186;de. Neste material voc&#195;&#170; encontrar&#195;&#161; as informa&#195;&#167;&#195;&#181;es necess&#195;&#161;rias para diagn&#195;&#179;stico, planejamento e articula&#195;&#167;&#195;&#163;o intersetorial para a&#195;&#167;&#195;&#181;es de promo&#195;&#167;&#195;&#163;o da SAN nos territ&#195;&#179;rios de sa&#195;&#186;de. Inseguran&#195;&#167;a alimentar na aten&#195;&#167;&#195;&#163;o prim&#195;&#161;ria &#195;&#160; sa&#195;&#186;de: manual de identifica&#195;&#167;&#195;&#163;o dos domic&#195;&#173;lios e organiza&#195;&#167;&#195;&#163;o da rede (Brasil, 2022). Dispon&#195;&#173;vel aqui.">
<text fill="#2A2828" xml:space="preserve" style="white-space: pre" font-family="Montserrat" font-size="19" font-weight="500" letter-spacing="0em"><tspan x="162.912" y="203.28">O instrutivo sobre inseguran&#xe7;a alimentar na APS est&#xe1; dispon&#xed;vel para todas as unidades de </tspan><tspan x="162.912" y="226.28">sa&#xfa;de. Neste material voc&#xea; encontrar&#xe1; as informa&#xe7;&#xf5;es necess&#xe1;rias para diagn&#xf3;stico, </tspan><tspan x="162.912" y="249.28">planejamento e articula&#xe7;&#xe3;o intersetorial para a&#xe7;&#xf5;es de promo&#xe7;&#xe3;o da SAN nos territ&#xf3;rios de </tspan><tspan x="162.912" y="272.28">sa&#xfa;de. </tspan><tspan x="745.102" y="272.28">: manual de identifica&#xe7;&#xe3;o dos </tspan><tspan x="162.912" y="295.28">domic&#xed;lios e organiza&#xe7;&#xe3;o da rede (Brasil, 2022). Dispon&#xed;vel </tspan></text>
<text fill="#2A2828" xml:space="preserve" style="white-space: pre" font-family="Montserrat" font-size="19" font-style="italic" font-weight="500" letter-spacing="0em"><tspan x="230.636" y="272.28">Inseguran&#xe7;a alimentar na aten&#xe7;&#xe3;o prim&#xe1;ria &#xe0; sa&#xfa;de</tspan></text>
